plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forja.chat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.forja.chat'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
